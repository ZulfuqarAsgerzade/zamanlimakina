# Netlify konfiqurasiyası — Zamanlı Makina
# Build: npm run build  (tsc → vite build → prerender). Nəticə dist/ qovluğundadır.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Asılılıqlar (Vite 8 / Rolldown) Node ^20.19.0 || >=22.12.0 tələb edir
  NODE_VERSION = "22"

# Qəsdən SPA fallback ("/* → /index.html") YOXDUR: mövcud olmayan ünvanlar
# Netlify tərəfindən public/404.html ilə 404 statusunda cavablandırılır.

# Hash-li fayllar (dəyişdikdə adı da dəyişir) — uzun müddətli keş
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Təhlükəsizlik başlıqları (real Chrome-da CSP pozuntusu olmadan yoxlanılıb; bax: README).
# script-src hash-i index.html-dəki tək inline skriptə (html.js sinfi) aiddir —
# həmin skript dəyişərsə hash-i yenidən hesablayın.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-k8ZoqoS/qHVRhkcvg0oiWri9mxhXHtdBYt1phVUaxW8='; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"
