# Netlify configuration — Zamanlı Makina
# Build: npm run build  (tsc → vite build). Output: dist/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Routing: `scripts/prerender.ts` writes dist/_redirects (generated from the route table) and dist/404.html.
#  • every important public URL is a real prerendered file → served as-is (HTTP 200, full HTML + metadata)
#  • /admin, /search and slugs published after the last build are rewritten (200) to /shell.html, the empty app shell
#  • anything else gets dist/404.html with a real HTTP 404 status
# There is deliberately NO catch-all "/* → /index.html" rule.

# Hashed build files — immutable long-term cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/demo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Admin: never index, never cache (bare /admin and everything below it)
[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Security headers.
# CSP notes: connect-src / img-src allow the Supabase project (https://*.supabase.co) for API + Storage images.
# If you add analytics (GA4 / Plausible / GTM) add their script + connect domains here, or the browser blocks them.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
